# Installs a released pawl binary on a Linux or macOS runner, verified against the release's checksums.txt.
name: Set up Pawl
description: Install a released pawl, checked against the release's SHA-256 checksums, and put it on the PATH.
author: rojosinalma
branding:
  icon: check-square
  color: green

inputs:
  version:
    description: The pawl release to install, vX.Y.Z or latest. The default is the release this action ships with.
    required: false
    default: v0.3.0

outputs:
  version:
    description: The version that `pawl --version` reports.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - id: install
      shell: bash
      env:
        PAWL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        # RUNNER_OS and RUNNER_ARCH are set by the runner; the release has Linux and macOS archives for amd64 and arm64.
        case "${RUNNER_OS}" in
          Linux) os=linux; sum=(sha256sum -c) ;;
          macOS) os=darwin; sum=(shasum -a 256 -c) ;;
          *) echo "::error::Set up Pawl runs on Linux and macOS runners, not ${RUNNER_OS}"; exit 1 ;;
        esac
        case "${RUNNER_ARCH}" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::Set up Pawl runs on X64 and ARM64 runners, not ${RUNNER_ARCH}"; exit 1 ;;
        esac
        # The input becomes part of a URL: only a release tag or latest.
        if [[ ! "${PAWL_VERSION}" =~ ^(latest|v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::version must be latest or vX.Y.Z, not '${PAWL_VERSION}'"
          exit 1
        fi
        if [[ "${PAWL_VERSION}" == latest ]]; then
          base="https://github.com/rojosinalma/pawl/releases/latest/download"
          asset="pawl_${os}_${arch}.tar.gz"
        else
          base="https://github.com/rojosinalma/pawl/releases/download/${PAWL_VERSION}"
          asset="pawl_${PAWL_VERSION#v}_${os}_${arch}.tar.gz"
        fi
        work="$(mktemp -d "${RUNNER_TEMP}/pawl.XXXXXX")"
        curl -fsSL --retry 3 -o "${work}/${asset}" "${base}/${asset}"
        curl -fsSL --retry 3 -o "${work}/checksums.txt" "${base}/checksums.txt"
        # Check the archive against its own line only, so a missing line fails instead of passing vacuously.
        awk -v f="${asset}" '$2 == f' "${work}/checksums.txt" > "${work}/asset.sha256"
        if [[ ! -s "${work}/asset.sha256" ]]; then
          echo "::error::checksums.txt of ${PAWL_VERSION} has no line for ${asset}"
          exit 1
        fi
        (cd "${work}" && "${sum[@]}" asset.sha256)
        mkdir -p "${work}/bin"
        tar -xzf "${work}/${asset}" -C "${work}/bin" pawl
        echo "${work}/bin" >> "${GITHUB_PATH}"
        reported="$("${work}/bin/pawl" --version)"
        echo "${reported}"
        echo "version=${reported##* }" >> "${GITHUB_OUTPUT}"
