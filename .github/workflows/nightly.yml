# pawl: the nightly ring. Everything slow (mutation, audits, docs drift, ring budgets) on the whole tree.
# Project-owned: edit freely. A failure opens, or comments on, one issue titled "nightly failed".
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # `pawl budget` reads the durations of the last check and nightly runs
      issues: write # open or comment on the "nightly failed" issue
    env:
      PAWL_FULL: "1"
      # Pawl is optional for make; in CI a missing Pawl is an error.
      PAWL_REQUIRED: "1"
      PAWL_BASE: origin/main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: make nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: make nightly
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: nightly failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number="$(gh issue list --state open --search "in:title ${TITLE}" --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Failed again: ${RUN_URL}"
          else
            gh issue create --title "${TITLE}" --body "The nightly ring failed: ${RUN_URL}"
          fi
