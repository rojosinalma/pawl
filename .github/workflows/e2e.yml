# End-to-end: build the toolbox image, then run pawl against the fixture projects of every stack with the real tools.
name: e2e

on:
  pull_request:
    paths: ["internal/**", "cmd/**", "test/**", "toolbox/**", "go.mod", "go.sum", "action.yml", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: toolbox/Dockerfile
          load: true
          tags: pawl-toolbox:ci
          build-args: PAWL_VERSION=ci
      - name: Fixtures of every stack
        run: make e2e TOOLBOX_IMAGE=pawl-toolbox:ci

  # A fresh project without the toolbox, both ways: the tools from the generated mise.toml through mise-action and
  # `make check`; or `pawl install` (which brings mise, make and the tools) and `pawl run check`.
  fresh:
    name: fresh project, ${{ matrix.way }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - way: mise and make
            target: e2e-project-check
          - way: pawl install and pawl run check
            target: e2e-project-pawl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build pawl and initialise the Go fixture as a new repository
        run: make e2e-project E2E_PROJECT="${RUNNER_TEMP}/project"
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        if: matrix.target == 'e2e-project-check'
        with:
          working_directory: ${{ runner.temp }}/project
      - name: The gate of the new project
        env:
          TARGET: ${{ matrix.target }}
        run: make "${TARGET}" E2E_PROJECT="${RUNNER_TEMP}/project"

  # The setup action installs a released pawl on both runner systems it supports.
  action:
    name: the setup action installs a released pawl (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # the action of this commit, by the self-repository syntax: no checkout, nothing a step could have changed
      - id: pawl
        uses: $/
        with:
          version: latest
      - name: pawl is on the PATH and reports the version the action output
        env:
          REPORTED: ${{ steps.pawl.outputs.version }}
        run: |
          pawl --version
          [[ "$(pawl --version)" == "pawl version ${REPORTED}" ]]
