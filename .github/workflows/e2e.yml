# End-to-end: build the toolbox image, then run pawl against the fixture projects of every stack with the real tools.
name: e2e

on:
  pull_request:
    paths: ["internal/**", "cmd/**", "test/**", "toolbox/**", "go.mod", "go.sum", ".github/workflows/e2e.yml"]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the toolbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: toolbox/Dockerfile
          load: true
          tags: pawl-toolbox:ci
          build-args: PAWL_VERSION=ci
      - name: Fixtures of every stack
        run: make e2e TOOLBOX_IMAGE=pawl-toolbox:ci
