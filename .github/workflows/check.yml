# pawl: the check ring. `make check` is the merge gate; `make coverage` checks the changed lines.
# Project-owned: edit freely. Runs on pull requests, on the default branch and in a merge queue.
name: check

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAWL_BASE: origin/${{ github.base_ref || 'main' }}
      # Pawl is optional for make; in CI a missing Pawl is an error.
      PAWL_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      - name: make check
        run: make check
      - name: make coverage
        run: make coverage
      - name: Annotate the findings
        if: failure()
        run: ./pawl verify --format github
