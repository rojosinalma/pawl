# actionlint configuration written by pawl. Add self-hosted runner labels under self-hosted-runner.labels.
self-hosted-runner:
  labels: []
config-variables: null
# actionlint 1.7.12 does not know GitHub's self-repository syntax (`uses: $/`, July 2026), which zizmor asks for:
# https://docs.zizmor.sh/audits/#self-repository. Remove this when actionlint accepts it.
paths:
  .github/workflows/e2e.yml:
    ignore:
      - 'specifying action "\$/" in invalid format'
