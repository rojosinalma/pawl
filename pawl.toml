# name = "..."
# suite = "test/principles/*_test.go"

# [[contracts]]             # a schema or API whose breaking change needs a version bump (drift.contracts)
# name = "api"
# path = "docs/openapi.yaml"
# kind = "openapi"
# version = "1.0.0"

