# pawl rule pack: tests.smells. A skipped test carries a reason.
id: skip-without-reason-go
language: Go
severity: error
message: t.Skip without a reason hides a test; use t.Skip("reason") or t.Skipf.
rule:
  kind: call_expression
  all:
    - has: {field: function, regex: '\.(Skip|SkipNow)$'}
    - has: {field: arguments, regex: '^\(\s*\)$'}
files: ["**/*_test.go"]
---
id: skip-without-reason-rs
language: Rust
severity: error
message: '#[ignore] without a reason hides a test; use #[ignore = "reason"].'
# the pattern "#[ignore]" also matches #[ignore = "reason"], so the rule compares the attribute text
rule:
  kind: attribute_item
  regex: '^#\[\s*ignore\s*\]$'
files: ["**/*.rs"]
---
id: skip-without-reason-py
language: Python
severity: error
message: A skip marker without a reason hides a test; use pytest.mark.skip(reason="...").
rule:
  any:
    - pattern: pytest.mark.skip()
    - pattern: pytest.skip()
    - pattern: unittest.skip()
files: ["**/test_*.py", "**/*_test.py", "**/tests/**/*.py"]
