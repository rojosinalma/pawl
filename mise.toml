# pawl: the tools of the rings (hook, check, nightly), pinned. `mise install` installs them.
# The stack's runtime stays in its native pin file (go.mod, .ruby-version, .python-version, rust-toolchain.toml).
[tools]
# every stack
ast-grep = "0.51.2"
"npm:jscpd" = "5.4.3"
typos = "1.52.2"
gitleaks = "8.30.1"
"pypi:diff-cover" = "11.0.2"
# Go
golangci-lint = "2.15.0"
"github:go-gremlins/gremlins" = "0.6.0"
# Shell, Docker and GitHub Actions
shellcheck = "0.11.0"
shfmt = "3.14.1"
hadolint = "2.15.1"
"aqua:rhysd/actionlint" = "1.7.12"
bats = "1.14.0"
zizmor = "1.32.0"
# runtimes of the npm: and pypi: tools
node = "24.22.2"
python = "3.13.18"
uv = "0.13.8"
